<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>市調中樞</title>
<meta name="description" content="多品牌市調系統：門市、評價、警示、查證與匯出">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="市調中樞">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--sub:#5b6476;--line:#e3e6ec;--acc:#0f766e;--acc2:#e6f4f2;--red:#c0392b;--redbg:#fdecea;--yel:#9a6a00;--yelbg:#fff6dc;--ok:#1e7d4f;--okbg:#e5f5ec;
 --b1:#0f766e;--b2:#c2410c;--b3:#4f46e5;--b4:#be185d;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a2029;--ink:#e8ebf0;--sub:#9aa3b2;--line:#2b3340;--acc:#2dd4bf;--acc2:#163a37;--red:#ff7b6b;--redbg:#3a1e1b;--yel:#f2c14e;--yelbg:#3a3118;--ok:#5ad19a;--okbg:#17352a;--b1:#2dd4bf;--b2:#fb923c;--b3:#818cf8;--b4:#f472b6;}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a2029;--ink:#e8ebf0;--sub:#9aa3b2;--line:#2b3340;--acc:#2dd4bf;--acc2:#163a37;--red:#ff7b6b;--redbg:#3a1e1b;--yel:#f2c14e;--yelbg:#3a3118;--ok:#5ad19a;--okbg:#17352a;--b1:#2dd4bf;--b2:#fb923c;--b3:#818cf8;--b4:#f472b6;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc)}
button,select,input{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
#side{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
#side h1{font-size:18px;margin:4px 8px 18px}
#side h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--sub)}
.nav button.on{background:var(--acc2);color:var(--acc);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;background:var(--redbg);color:var(--red);border-radius:10px;padding:0 7px}
#main{flex:1;min-width:0;padding:22px 26px 90px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:22px;flex:1;min-width:160px}
.muted{color:var(--sub);font-size:13px}
.grid{display:grid;gap:14px;align-items:start}
.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 10px;font-size:16px}
.brand-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--sub)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red)}.chip.y{background:var(--yelbg);color:var(--yel)}.chip.g{background:var(--okbg);color:var(--ok)}.chip.n{background:var(--line);color:var(--sub)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar select,.bar input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.bar input{flex:1;min-width:140px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);color:var(--sub);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
#map{height:380px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;z-index:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.list .it{padding:10px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
.sec{margin-top:18px}
.empty{padding:30px;text-align:center;color:var(--sub)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:24px}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:6px 0 12px}
.err{background:var(--redbg);color:var(--red);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.bars .row{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;border-radius:6px}
#tabbar{display:none}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.form input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:15px}
.ok{background:var(--okbg);color:var(--ok);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
details{border-top:1px solid var(--line);padding:8px 0}details summary{cursor:pointer;font-weight:600}
.ctabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:6px 0 14px;-webkit-overflow-scrolling:touch}
.ctabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;color:var(--sub);white-space:nowrap;font-weight:500}
.ctabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.bar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.card select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
@media print{#side,#tabbar,.no-print{display:none!important}#main{padding:0}.card{break-inside:avoid;border-color:#ccc}.pbreak{break-before:page;font-size:20px}body{background:#fff}details>*{display:block}}

@media (max-width:820px){
 #side{display:none}
 #main{padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
 #tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
 #tabbar button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
 #tabbar button.on{color:var(--acc);font-weight:600}
 #tabbar .ic{font-size:18px;line-height:1}
 #tabbar .n{position:absolute;top:0;right:22%;font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px}
 #map{height:300px}
 .top h2{font-size:20px;min-width:0}
 .top .btn{padding:6px 10px;font-size:13px}
 .hide-m{display:none}
}
</style>
</head>
<body>
<div id="root"><div class="empty">載入中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const SB_URL = "https://thxqncpkkzmpktwuvzvz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoeHFuY3Bra3ptcGt0d3V2enZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTMyODcsImV4cCI6MjEwNjk4OTI4N30.cDjeuOxx2UZLrOWYcNhqy4dO2cdznscJ7CWr0DZGZ2g";
const REPO = "https://github.com/marvintien90-jpg/market-intel";
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const BCOL = ["var(--b1)", "var(--b2)", "var(--b3)", "var(--b4)"];
const PAGES = [
  ["home", "總覽", "◎"], ["cases", "調查", "＋"], ["stores", "門市", "⌖"], ["alerts", "警示", "!"],
  ["verify", "查證", "✓"], ["news", "動態", "≡"], ["export", "匯出", "⇩"]];
const MET = {
  stores_official: ["官網門市", "家"], stores_operational: ["地圖營業", "家"], map_coverage: ["地圖覆蓋", "%"],
  rating_weighted_strict: ["加權評分", "星"], reviews_per_store: ["每店評論", "則"], ticket_est: ["估計客單", "元"],
  entry_ticket: ["入門價", "元"], jobs_104: ["104 職缺", "個"], hiring_entities: ["徵才公司", "家"],
  search_share_52w: ["搜尋聲量占比", "%"], search_yoy_13w: ["近13週搜尋年增", "%"], revenue_decline_streak: ["營收連續年減", "月"]};
let S = { user: null, data: null, page: "home", err: "", busy: false, f: { brand: "", status: "operational", q: "", sort: "brand", dir: 1 } };
let map = null;
const C = { list: null, sel: null, sum: {}, msg: "", busy: false, timer: null, draft: {} };
const ST = { queued: ["排隊中", "n"], running: ["調查中", "y"], done: ["完成", "g"], partial: ["部分完成", "y"], failed: ["失敗", "r"] };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
const num = (v, d = 0) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("zh-TW", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmt = (m, v) => {
  if (v == null) return "—";
  const u = (MET[m] || [, ""])[1];
  if (u === "%") return (v > 0 && m.includes("yoy") ? "+" : "") + num(v * 100, 1) + "%";
  if (u === "星") return num(v, 2);
  return num(v) + " " + u;
};
const county = a => { const m = String(a || "").replace(/^\d+/, "").match(/^(.{2}[市縣])/); return m ? m[1].replace("台", "臺") : "—"; };
const stLab = s => ({ operational: ["營業中", "g"], temporarily_closed: ["暫停營業", "y"], permanently_closed: ["已歇業", "r"] }[s] || [s || "—", "n"]);
const gradeChip = g => { const k = String(g || "")[0]; return `<span class="chip ${k === "A" ? "g" : k === "B" ? "" : k === "C" ? "y" : "r"}">${esc(g || "—")}</span>`; };

function brands() { return (S.data?.brands || []).map(b => b.name); }
function bcol(name) { const i = brands().indexOf(name); return BCOL[(i < 0 ? 0 : i) % 4]; }
function bobs(brand, metric) { return S.data.obs.find(o => o.kind === "brand" && o.ref === brand && o.metric === metric)?.value ?? null; }
function sobs(id, metric) { return S.data.obs.find(o => o.kind === "store" && o.ref === id && o.metric === metric)?.value ?? null; }

function storeRows() {
  return S.data.stores.map(s => ({ ...s, county: county(s.address), rating: sobs(s.id, "rating"), reviews: sobs(s.id, "review_count"),
    recent: sobs(s.id, "review_recent_avg"), low: sobs(s.id, "review_low_share") }));
}

function alerts() {
  const out = [];
  for (const s of storeRows()) {
    if (s.recent != null && s.rating != null && s.rating - s.recent >= 0.15)
      out.push({ lv: s.rating - s.recent >= 0.5 ? "r" : "y", brand: s.brand, title: `${s.name}：近期評分下滑`, body: `最新 60 則平均 ${num(s.recent, 2)}，累計 ${num(s.rating, 1)}（差 ${num(s.rating - s.recent, 2)}）`, kind: "評論" });
    if (s.low != null && s.low >= 0.1)
      out.push({ lv: s.low >= 0.2 ? "r" : "y", brand: s.brand, title: `${s.name}：1–2 星偏多`, body: `最新 60 則中 1–2 星占 ${num(s.low * 100, 0)}%`, kind: "評論" });
    if (s.status === "temporarily_closed") out.push({ lv: "y", brand: s.brand, title: `${s.name}：地圖顯示暫停營業`, body: s.address, kind: "門市" });
  }
  for (const b of brands()) {
    const y = bobs(b, "search_yoy_13w"); if (y != null && y <= -0.25) out.push({ lv: "y", brand: b, title: `${b}：搜尋聲量年減 ${num(-y * 100, 0)}%`, body: "近 13 週 vs 去年同期", kind: "聲量" });
    const r = bobs(b, "revenue_decline_streak"); if (r) out.push({ lv: "r", brand: b, title: `${b}：營收連續 ${num(r)} 個月年減`, body: "公開資訊觀測站月營收", kind: "財務" });
  }
  for (const c of S.data.conflicts.filter(c => c.status === "open"))
    out.push({ lv: "n", brand: c.brand, title: `${c.brand}：${c.topic}（待查）`, body: c.verdict, kind: "矛盾" });
  const w = { r: 0, y: 1, n: 2 };
  return out.sort((a, b) => w[a.lv] - w[b.lv]);
}

async function load() {
  S.busy = true; S.err = ""; render();
  const { data, error } = await sb.rpc("mi_dashboard");
  S.busy = false;
  if (error) { S.err = /尚未開通/.test(error.message) ? "這個帳號還沒開通市調系統，請聯絡管理員開通。" : /登入/.test(error.message) ? "登入已過期，請重新登入。" : "讀取資料失敗：" + error.message + "。請稍後按「重新整理」。"; S.data = null; }
  else S.data = data;
  render();
}

function render() {
  const root = $("#root");
  if (!S.user) { root.innerHTML = loginHtml(); return; }
  if (!S.data) { root.innerHTML = `<div class="login"><div class="card"><h3>市調中樞</h3>${S.busy ? '<p class="muted">讀取資料中…</p>' : ""}${S.err ? `<div class="err">${esc(S.err)}</div>` : ""}<div class="bar"><button class="btn" data-reload>重新整理</button><button class="btn s" data-logout>登出</button></div><p class="muted">${esc(S.user.email)}</p></div></div>`; return; }
  const al = alerts().filter(a => a.lv !== "n").length;
  const nav = PAGES.map(([id, lab, ic]) => `<button data-go="${id}" class="${S.page === id ? "on" : ""}"><span class="ic">${ic}</span>${lab}${id === "alerts" && al ? `<span class="n">${al}</span>` : ""}</button>`).join("");
  root.innerHTML = `<div class="app"><aside id="side"><h1>市調中樞<small>多品牌市調系統</small></h1><div class="nav">${nav}</div>
    <div style="position:absolute;bottom:16px;left:12px;right:12px" class="muted">${esc(S.user.email)}<br><a href="#" data-logout>登出</a></div></aside>
    <main id="main">${(VIEWS[S.page] || VIEWS.home)()}</main><nav id="tabbar">${nav}</nav></div>`;
  if (S.page === "stores") drawMap();
  if (S.page === "cases" && C.sel && (C.tab === "store" || C.printing)) setTimeout(drawCaseMap, 0);
}

function loginHtml() {
  return `<div class="login"><div class="card"><h3 style="font-size:20px;margin:0 0 4px">市調中樞</h3><p class="muted" style="margin:0 0 16px">用 BOM 運算中心同一組帳號登入</p>
  <form id="lf"><label class="muted">電子郵件</label><input id="em" type="email" autocomplete="username" required value="${esc(S.email || "")}">
  <label class="muted">密碼</label><input id="pw" type="password" autocomplete="current-password" required>
  ${S.err ? `<div class="err">${esc(S.err)}</div>` : ""}<button class="btn" style="width:100%;padding:11px" ${S.busy ? "disabled" : ""}>${S.busy ? "登入中…" : "登入"}</button></form></div></div>`;
}

const head = (t, extra = "") => `<div class="top"><h2>${t}</h2>${extra}<button class="btn s" data-reload title="重新讀取最新資料">重新整理</button></div>`;

const VIEWS = {
  cases() {
    if (C.sel) return caseDetail(C.sel);
    const d = C.draft, inp = (k, lab, ph, req = "") => `<label>${lab}<input name="${k}" placeholder="${esc(ph)}" value="${esc(d[k] || "")}" ${req}></label>`;
    const list = C.list;
    const rows = !list ? '<div class="muted">讀取中…</div>' : !list.length ? '<div class="muted">還沒有調查，填上面表單開第一個。</div>' :
      `<div class="tw"><table><tr><th>品牌</th><th>品類／區域</th><th>狀態</th><th>送出</th></tr>${list.map(r => { const [l, c] = ST[r.status] || [r.status, "n"];
        return `<tr><td>${r.has_summary ? `<a href="#" data-case="${esc(r.id)}"><b>${esc(r.brand)}</b></a>` : `<b>${esc(r.brand)}</b>`}<div class="muted">${esc(r.competitors || "")}</div></td>
        <td>${esc(r.category || "")}<div class="muted">${esc([r.region, r.sites].filter(Boolean).join("・"))}</div></td>
        <td><span class="chip ${c}">${l}</span>${r.error ? `<div class="muted">${esc(r.error)}</div>` : ""}</td>
        <td class="muted">${esc(new Date(r.created_at).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }))}</td></tr>`; }).join("")}</table></div>`;
    return head("開新調查") + `<div class="card"><form id="cf" class="form">
      ${inp("brand", "品牌名 *", "例如：八方雲集", "required")}${inp("official_url", "官網網址", "https://…")}
      ${inp("category", "品類", "例如：火鍋、手搖飲、水餃")}${inp("competitors", "競品（逗號分隔）", "例如：四海遊龍, 鍋貼大王")}
      ${inp("region", "主場縣市", "例如：臺中市")}${inp("sites", "想評估的行政區（逗號分隔）", "例如：臺中市太平區, 新竹市東區")}
      ${inp("aliases", "品牌別名／簡稱（逗號分隔）", "例如：八方")}
      <div style="display:flex;align-items:flex-end;gap:10px"><button class="btn" ${C.busy ? "disabled" : ""}>${C.busy ? "送出中…" : "開始調查"}</button></div></form>
      ${C.msg ? `<div class="${C.msg.startsWith("✓") ? "ok" : "err"}">${esc(C.msg.replace(/^✓ /, ""))}</div>` : ""}
      <p class="muted" style="margin:10px 0 0">一次會跑 10 個面向：菜單價格、門市分布、口碑、促銷、通路、社群、人力、公司登記、商圈人口所得、競品。付費查詢每案上限 NT$9，約 15–30 分鐘完成。</p></div>
      <div class="sec"><div class="top"><h2 style="font-size:18px">調查紀錄</h2><button class="btn s" data-crefresh>更新進度</button></div>${rows}</div>`;
  },
  home() {
    const d = S.data, list = alerts();
    const cards = brands().map(b => `<div class="card"><div class="brand-h"><span class="dot" style="background:${bcol(b)}"></span><h3 style="margin:0">${esc(b)}</h3></div>
      <div class="kv">${["stores_official", "rating_weighted_strict", "reviews_per_store", "ticket_est", "jobs_104", "search_yoy_13w"].map(m => `<span>${MET[m][0]}</span><b>${fmt(m, bobs(b, m))}</b>`).join("")}</div></div>`).join("");
    const maxShare = Math.max(...brands().map(b => bobs(b, "search_share_52w") || 0), 0.01);
    const share = brands().map(b => { const v = bobs(b, "search_share_52w") || 0; return `<div class="row"><span>${esc(b)}</span><div class="track"><div class="fill" style="width:${v / maxShare * 100}%;background:${bcol(b)}"></div></div><b style="text-align:right">${num(v * 100, 1)}%</b></div>`; }).join("");

const BC = ["var(--b1)", "var(--b2)", "var(--b3)", "var(--b4)", "var(--sub)"];
function trendSvg(t) {
  const ks = t?.keywords || [], sr = t?.series || {}; const n = Math.max(0, ...ks.map(k => (sr[k] || []).length));

  const lines = ks.map((k, j) => `<polyline fill="none" stroke="${BC[j]}" stroke-width="2" points="${(sr[k] || []).map((p, i) => x(i).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ")}"/>`).join("");

function bucket(d, g) {

const TG_LIMIT = { "年": 6, "半年": 10, "季": 12, "月": 24, "週": 26 };
function timelineBlock(s, tbl, link) {

function listedBlock(s, tbl) {

// ===== 調查結果：分頁閱讀、圖表、篩選、匯出 =====
const CTABS = [["ov", "總覽"], ["cmp", "品牌比較"], ["tl", "時間軸"], ["bg", "背景調查"], ["voice", "聲量輿情"], ["price", "價格菜單"], ["store", "門市與地圖"], ["src", "來源與方法"]];
const QM = {
  stores: ["官網門市", r => r.stores, "家"], price: ["價格中位數", r => r.price?.median, "元"], mentions: ["新聞＋PTT 聲量", r => r.mentions, "則"],
  neg_share: ["負面比例", r => r.neg_share == null ? null : r.neg_share * 100, "%"], trend_avg: ["搜尋熱度", r => r.trend_avg, ""],
  trend_change: ["搜尋熱度季變化", r => r.trend_change == null ? null : r.trend_change * 100, "%"], map_rating: ["地圖評分", r => r.map_rating, "星"],
  map_reviews: ["地圖評論數", r => r.map_reviews, "則"], ig_avg_likes: ["IG 平均讚", r => r.ig_avg_likes, ""], ig_followers: ["IG 粉絲", r => r.ig_followers, ""],
  fb_avg_reactions: ["FB 平均互動", r => r.fb_avg_reactions, ""], news_8q: ["近 8 季新聞量", r => r.news_8q, "則"],
  capital: ["資本額（萬）", r => r.company?.capital ? r.company.capital / 10000 : null, "萬"],
  risk: ["風險新聞合計", r => r.risk && Object.keys(r.risk).length ? Object.values(r.risk).reduce((a, b) => a + b, 0) : null, "則"],
  revenue: ["月營收（百萬）", r => r.listed?.revenue_k ? r.listed.revenue_k / 1000 : null, "百萬"]};
const SCORE_DIMS = [["規模", "stores", 1], ["聲量", "mentions", 1], ["口碑", "neg_share", -1], ["搜尋", "trend_avg", 1], ["評分", "map_rating", 1], ["社群", "ig_avg_likes", 1]];
const bcolOf = (s, n) => BC[[s.brand, ...(s.competitors || [])].indexOf(n)] || "var(--sub)";
const shown = s => (s.compare || []).filter(r => !(C.hide || []).includes(r.brand));
const qv = (k, r) => { const v = QM[k][1](r); return v == null || isNaN(v) ? null : Number(v); };

function scorecard(s) {
  const rows = s.compare || [];
  return rows.map(r => {
    const dims = SCORE_DIMS.map(([lab, k, dir]) => {
      const vals = rows.map(x => qv(k, x)).filter(v => v != null);
      const v = qv(k, r); if (v == null || vals.length < 2) return [lab, null];
      const lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) return [lab, 50];
      const t = (v - lo) / (hi - lo); return [lab, Math.round((dir > 0 ? t : 1 - t) * 100)];

    return { brand: r.brand, dims, total: ok.length >= 3 ? Math.round(ok.reduce((a, d) => a + d[1], 0) / ok.length) : null, n: ok.length };
  });
}

function insights(s) {
  const out = [], rows = s.compare || [], me = rows[0]; if (!me) return out;
  const add = (lv, t, src) => out.push({ lv, t, src });
  const rank = (k, desc = true) => { const xs = rows.filter(r => qv(k, r) != null).sort((a, b) => desc ? qv(k, b) - qv(k, a) : qv(k, a) - qv(k, b)); return [xs.findIndex(r => r.brand === me.brand) + 1, xs.length, xs[0]]; };
  if (me.stores != null) { const [i, n, top] = rank("stores"); const partial = !(s.official?.learned || []).length && me.stores < 100;
    add(partial ? "C" : "A", `官網門市 ${num(me.stores)} 家，在 ${n} 個有資料的品牌中排第 ${i}${top && top.brand !== me.brand ? `（最多是 ${top.brand} ${num(top.stores)} 家）` : ""}。${partial ? "這次爬蟲沒有學到翻頁方式，門市數可能沒抓全，請對照背景調查裡的官方規模數字。" : ""}`, "官網門市頁（爬蟲自動翻頁）"); }
  if (me.county_top?.length && me.stores) { const [c, v] = me.county_top[0]; add("A", `門市最集中在${c}（${num(v)} 家，占 ${num(v / me.stores * 100)}%）。`, "官網門市地址"); }
  if (me.price?.median) { const comp = rows.slice(1).map(r => r.price?.median).filter(Boolean).sort((a, b) => a - b); const mid = comp.length ? comp[Math.floor(comp.length / 2)] : null;
    add(me.price_source === "官網" ? "A" : "C", `價格中位數 ${num(me.price.median)} 元（中間一半 ${num(me.price.p25)}–${num(me.price.p75)} 元）${mid ? `，競品中位數約 ${num(mid)} 元，${me.price.median > mid ? "偏高" : me.price.median < mid ? "偏低" : "相當"}` : ""}。`, me.price_source || "菜單"); }
  if (me.mentions != null) { const [i, n] = rank("mentions"); const tot = rows.reduce((a, r) => a + (r.mentions || 0), 0);
    add("B", `新聞與 PTT 聲量 ${num(me.mentions)} 則，占全部品牌的 ${tot ? num(me.mentions / tot * 100) : "—"}%，排第 ${i}／${n}；負面比例 ${me.neg_share == null ? "—" : num(me.neg_share * 100) + "%"}。`, "Google 新聞、PTT 標題分類"); }
  const nh = (s.news_history || {})[me.brand]; if (nh) { const ks = Object.keys(nh).sort(); if (ks.length >= 2) { const a = nh[ks.at(-2)].n, b = nh[ks.at(-1)].n; add("B", `新聞量 ${ks.at(-1)} 有 ${num(b)} 則（本季尚未結束），上一季 ${ks.at(-2)} 為 ${num(a)} 則；近 8 季合計 ${num(ks.reduce((t, k) => t + nh[k].n, 0))} 則。`, "Google 新聞逐季回溯"); } }

function svgBars(items, unit = "", w = 640) {
  const mx = Math.max(1, ...items.map(x => Math.abs(x.v || 0))), H = items.length * 30 + 10, L = 120;
  return `<svg viewBox="0 0 ${w} ${H}" style="width:100%;height:auto;max-height:${H + 20}px" role="img">${items.map((x, i) => { const bw = x.v == null ? 0 : Math.abs(x.v) / mx * (w - L - 90);
    return `<g><title>${esc(x.label)}：${x.v == null ? "沒有資料" : num(x.v, 1) + unit}</title><text x="${L - 8}" y="${i * 30 + 24}" font-size="13" text-anchor="end" fill="var(--ink)">${esc(x.label)}</text><rect x="${L}" y="${i * 30 + 10}" width="${bw.toFixed(1)}" height="18" rx="4" fill="${x.c}"/><text x="${L + bw + 6}" y="${i * 30 + 24}" font-size="12" fill="var(--sub)">${x.v == null ? "—" : num(x.v, Math.abs(x.v) < 10 ? 1 : 0) + unit}</text></g>`; }).join("")}</svg>`;
}

function quadrant(s, kx, ky) {
  const pts = shown(s).map(r => ({ b: r.brand, x: qv(kx, r), y: qv(ky, r) })).filter(p => p.x != null && p.y != null);
  if (pts.length < 2) return `<div class="muted">這兩個指標有資料的品牌不到 2 個，換一組指標試試。</div>`;
  const W = 640, H = 360, P = 50, xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)], [y0, y1] = [Math.min(...ys), Math.max(...ys)], pad = (a, b) => (b - a) * 0.15 || Math.abs(a) * 0.2 || 1;
  const X = v => P + (v - (x0 - pad(x0, x1))) / ((x1 + pad(x0, x1)) - (x0 - pad(x0, x1))) * (W - 2 * P), Y = v => H - P - (v - (y0 - pad(y0, y1))) / ((y1 + pad(y0, y1)) - (y0 - pad(y0, y1))) * (H - 2 * P);

    <rect x="${P}" y="${P / 2}" width="${W - 2 * P}" height="${H - 1.5 * P}" fill="none" stroke="var(--line)"/>
    <line x1="${X(mx)}" y1="${P / 2}" x2="${X(mx)}" y2="${H - P}" stroke="var(--line)" stroke-dasharray="4 4"/><line x1="${P}" y1="${Y(my)}" x2="${W - P}" y2="${Y(my)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    ${pts.map(p => `<g><title>${esc(p.b)}｜${QM[kx][0]} ${num(p.x, 1)}｜${QM[ky][0]} ${num(p.y, 1)}</title><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="9" fill="${bcolOf(s, p.b)}" opacity=".85"/><text x="${X(p.x) + 12}" y="${Y(p.y) + 4}" font-size="13" fill="var(--ink)">${esc(p.b)}</text></g>`).join("")}
    <text x="${W / 2}" y="${H - 12}" font-size="12" fill="var(--sub)" text-anchor="middle">${esc(QM[kx][0])} →</text><text x="14" y="${H / 2}" font-size="12" fill="var(--sub)" text-anchor="middle" transform="rotate(-90 14 ${H / 2})">${esc(QM[ky][0])} →</text></svg>
    <p class="muted">虛線是這批品牌的中位數，把畫面切成四個象限；滑鼠移到點上看數值。</p>`;
}

function stbl(id, cols, rows) {
  const st = (C.sort || {})[id];
  if (st) { const c = cols.find(c => c[0] === st.k); const g = c?.[4] || (r => r[st.k]); rows = rows.slice().sort((a, b) => { const x = g(a), y = g(b); if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * st.d; }); }
  return rows.length ? `<div class="tw"><table><tr>${cols.map(c => `<th data-cs="${id}|${c[0]}" title="點一下排序">${c[1]}${st?.k === c[0] ? (st.d > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr>${rows.map(r => `<tr>${cols.map(c => `<td class="${c[2] || ""}">${c[3] ? c[3](r) : esc(r[c[0]] ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>` : '<div class="muted">這次沒有抓到資料</div>';
}

function heat(s) {
  const iss = s.issues || {}, names = shown(s).map(r => r.brand), cats = [...new Set(names.flatMap(n => Object.keys(iss[n]?.issues || {})))];
  if (!cats.length) return '<div class="muted">沒有議題資料</div>';

  return `<div class="tw"><table><tr><th>議題</th>${names.map(n => `<th>${esc(n)}</th>`).join("")}</tr>${cats.map(c => `<tr><td>${esc(c)}</td>${names.map(n => { const v = iss[n]?.issues?.[c] || 0; const neg = ["關店", "食安品質", "客訴服務", "漲價"].includes(c);
    return `<td class="num" style="background:color-mix(in srgb, ${neg ? "var(--red)" : "var(--acc)"} ${Math.round(v / mx * 45)}%, transparent)">${v || ""}</td>`; }).join("")}</tr>`).join("")}</table></div><p class="muted">顏色越深則數越多；紅色系是負面議題。</p>`;
}

function priceRange(s) {

  const mx = Math.max(...rows.map(r => r.price.p75 * 1.3, 0)), W = 640, L = 120, sc = v => L + Math.min(v, mx) / mx * (W - L - 30);

      <line x1="${sc(p.min)}" x2="${sc(p.max)}" y1="${y + 9}" y2="${y + 9}" stroke="var(--sub)"/><rect x="${sc(p.p25)}" y="${y}" width="${Math.max(2, sc(p.p75) - sc(p.p25))}" height="18" rx="3" fill="${bcolOf(s, r.brand)}" opacity=".75"/><line x1="${sc(p.median)}" x2="${sc(p.median)}" y1="${y - 2}" y2="${y + 20}" stroke="var(--ink)" stroke-width="2"/></g>`; }).join("")}
    ${[0, .25, .5, .75, 1].map(t => `<text x="${sc(mx * t)}" y="${rows.length * 36 + 26}" font-size="11" fill="var(--sub)" text-anchor="middle">${num(mx * t)}</text>`).join("")}</svg><p class="muted">色塊是中間一半品項的價格，粗線是中位數，細線延伸到最低與最高價（超過圖表範圍的高價品項截斷）。</p>`;
}

function countyStack(s) {
  const rows = shown(s).filter(r => (r.county_top || []).length); if (!rows.length) return '<div class="muted">沒有門市縣市資料</div>';
  const counties = [...new Set(rows.flatMap(r => r.county_top.map(x => x[0])))].slice(0, 10);
  return svgBars(counties.flatMap(c => rows.map(r => ({ label: c + "・" + r.brand, v: ((r.county_top.find(x => x[0] === c) || [])[1]) || 0, c: bcolOf(s, r.brand) }))).filter(x => x.v), " 家");
}

function brandFilter(s) {
  return `<div class="bar" style="align-items:center"><span class="muted">顯示品牌：</span>${(s.compare || []).map(r => { const off = (C.hide || []).includes(r.brand);
    return `<button class="btn s" data-hb="${esc(r.brand)}" style="padding:4px 10px;${off ? "opacity:.45;text-decoration:line-through" : `border-color:${bcolOf(s, r.brand)}`}"><b style="color:${bcolOf(s, r.brand)}">●</b> ${esc(r.brand)}</button>`; }).join("")}</div>`;
}

function caseTab(s, id, tab, tbl, link) {
  const o = s.official || {}, b = s.budget || {};
  if (tab === "ov") {
    const me = (s.compare || [])[0] || {}, sc = scorecard(s);
    const tiles = [["官網門市", num(me.stores), "家"], ["價格中位數", num(me.price?.median), "元"], ["聲量", num(me.mentions), "則"], ["負面比例", me.neg_share == null ? "—" : num(me.neg_share * 100), "%"],
      ["搜尋熱度", num(me.trend_avg), me.trend_change == null ? "" : `季 ${me.trend_change > 0 ? "+" : ""}${num(me.trend_change * 100)}%`], ["地圖評分", num(me.map_rating, 2), "星"],
      ["近 8 季新聞", num(me.news_8q), "則"], ["月營收年增", me.listed ? num(me.listed.yoy_pct, 1) : "—", me.listed ? "%" : "非上市櫃"]];
    const ins = insights(s);
    return `<div class="grid g4" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${tiles.map(t => `<div class="card"><div class="muted">${t[0]}</div><div style="font-size:24px;font-weight:700">${t[1]}<span class="muted" style="font-size:13px;font-weight:400"> ${t[2]}</span></div></div>`).join("")}</div>
      <div class="card sec list"><h3>重點發現（系統依數字自動整理）</h3>${ins.map(x => `<div class="it">${gradeChip(x.lv)} ${esc(x.t)}<div class="muted">來源：${esc(x.src)}</div></div>`).join("") || '<div class="muted">資料不足</div>'}</div>
      <div class="card sec"><h3>綜合評分卡</h3>${stbl("sc", [["brand", "品牌", "", r => `<b style="color:${bcolOf(s, r.brand)}">●</b> ${esc(r.brand)}`], ...SCORE_DIMS.map((d, i) => [d[0], d[0], "num", r => { const v = r.dims[i][1]; return v == null ? "—" : `<span title="${v} 分" style="display:inline-block;width:${Math.max(4, v * .6)}px;height:8px;border-radius:4px;background:${bcolOf(s, r.brand)};vertical-align:middle"></span> ${v}`; }, r => r.dims[i][1]]), ["total", "綜合", "num", r => r.total == null ? "—" : `<b>${r.total}</b> <span class="muted">（${r.n} 面向）</span>`, r => r.total]], sc)}
      <p class="muted">每個面向在這批品牌裡換算成 0–100（最好 100、最差 0，負面比例越低越好），綜合是有資料面向的平均。只適合同一次調查內比較。</p></div>
      ${historyBlock(s, tbl)}`;
  }
  if (tab === "cmp") {
    const kx = C.qx || "stores", ky = C.qy || "mentions", km = C.qm || "stores";
    const opt = (n, cur) => `<select data-${n}>${Object.entries(QM).map(([k, v]) => `<option value="${k}"${k === cur ? " selected" : ""}>${esc(v[0])}</option>`).join("")}</select>`;
    const pct = v => v == null ? "—" : (v > 0 ? "+" : "") + Math.round(v * 100) + "%";
    const price = p => p && p.items ? `${num(p.median)}（${num(p.p25)}–${num(p.p75)}，${num(p.items)} 項）` : "—";
    const table = stbl("cmp", [["brand", "品牌", "", r => `<span style="white-space:nowrap"><b style="color:${bcolOf(s, r.brand)}">●</b> ${r.url ? link(r.url, r.brand) : esc(r.brand)}</span>` + (r.site_error ? `<div class="muted">${esc(r.site_error)}</div>` : "")],
      ["stores", "官網門市", "num", r => num(r.stores)], ["stores_home", "主場門市", "num", r => num(r.stores_home)], ["price", "價格中位數", "num", r => price(r.price), r => r.price?.median],
      ["mentions", "聲量", "num", r => num(r.mentions)], ["neg_share", "負面", "num", r => r.neg_share == null ? "—" : Math.round(r.neg_share * 100) + "%"],
      ["trend_avg", "搜尋熱度", "num", r => r.trend_avg == null ? "—" : num(r.trend_avg) + `（季 ${pct(r.trend_change)}）`], ["map_rating", "地圖評分", "num", r => r.map_rating == null ? "—" : num(r.map_rating, 2) + `（${num(r.map_reviews)}）`],
      ["ig_avg_likes", "IG 讚／月發文", "num", r => r.ig_avg_likes == null ? "—" : num(r.ig_avg_likes) + "／" + num(r.ig_per_30d, 1)], ["fb_avg_reactions", "FB 互動／月發文", "num", r => r.fb_avg_reactions == null ? "—" : num(r.fb_avg_reactions) + "／" + num(r.fb_per_30d, 1)],
      ["ads_own", "Meta 廣告", "num", r => r.ads_own == null ? "—" : num(r.ads_own) + "（" + num(r.ads_active) + "）"], ["news_8q", "近 8 季新聞", "num", r => num(r.news_8q)],
      ["capital", "資本額／設立", "num", r => r.company ? num((r.company.capital || 0) / 10000) + " 萬／" + esc((r.company.setup || "").slice(0, 4)) : "—", r => r.company?.capital],
      ["risk", "風險新聞", "num", r => num(qv("risk", r)), r => qv("risk", r)],
      ["listed", "月營收（年增）", "num", r => r.listed ? `${num((r.listed.revenue_k || 0) / 1000, 1)} 百萬（${num(r.listed.yoy_pct, 1)}%）` : "—", r => r.listed?.revenue_k]], shown(s));
    return `<div class="card"><h3>品牌 vs 競品總表（點欄位標題排序）</h3>${table}</div>
      <div class="card sec"><h3>定位象限圖</h3><div class="bar">橫軸 ${opt("qx", kx)} 縱軸 ${opt("qy", ky)}</div>${quadrant(s, kx, ky)}</div>
      <div class="card sec"><h3>單一指標排名</h3><div class="bar">${opt("qm", km)}</div>${svgBars(shown(s).map(r => ({ label: r.brand, v: qv(km, r), c: bcolOf(s, r.brand) })).sort((a, b) => (b.v ?? -1e9) - (a.v ?? -1e9)), " " + QM[km][2])}</div>
      <div class="card sec"><h3>搜尋熱度（近 5 年，每週）</h3>${trendSvg(s.trends)}</div>`;
  }
  if (tab === "tl") return timelineBlock(s, tbl, link) || '<div class="card muted">這次沒有時間軸資料（舊的調查要重新跑一次才有）。</div>';
  if (tab === "bg") return (backgroundBlock(s, tbl, link) || '<div class="card muted">這次沒有背景調查資料（舊的調查要重新跑一次才有）。</div>') + listedBlock(s, tbl) +
    `<div class="card sec"><h3>商工登記關鍵字查詢</h3>${tbl([["name", "名稱"], ["id", "統編"], ["capital", "資本額", "num", r => num(r.capital)], ["owner", "負責人"], ["address", "地址"], ["setup", "設立"]], s.registry || [])}</div>`;
  if (tab === "voice") {
    const rows = shown(s), tot = rows.reduce((a, r) => a + (r.mentions || 0), 0);
    const iss = Object.entries(s.issues || {}).filter(([b]) => !(C.hide || []).includes(b)).map(([b, o]) => `<details><summary><b>${esc(b)}</b>：負面標題 ${num(o.neg)} 則</summary>${(o.neg_titles || []).map(x => `<div class="it">${link(x.url, x.title)} <span class="muted">${esc(x.src)} ${esc(x.date)}</span></div>`).join("") || '<div class="muted">沒有負面標題</div>'}</details>`).join("");
    const ad = Object.entries(s.meta_ads || {}).map(([b, a]) => a.error ? `<div class="muted">${esc(b)}：${esc(a.error)}</div>` : `<details><summary>${esc(b)}：自家廣告 ${num(a.own_ads)}（投放中 ${num(a.own_active)}）</summary>${(a.samples || []).map(x => `<div class="it"><b>${esc(x.page)}</b> <span class="muted">${esc(x.start || "")}</span><div class="muted">${esc(x.text)}</div></div>`).join("")}</details>`).join("");
    const rel = s.related && !s.related.error ? ["top", "rising"].filter(k => s.related[k]).map(k => `<div><b>${k === "top" ? "最常一起搜" : "正在竄升"}</b>：${s.related[k].map(x => esc(x.q)).join("、")}</div>`).join("") : "";
    return `<div class="card"><h3>聲量占比（新聞＋PTT）</h3>${svgBars(rows.map(r => ({ label: r.brand, v: tot ? (r.mentions || 0) / tot * 100 : null, c: bcolOf(s, r.brand) })), "%")}</div>
      <div class="card sec"><h3>負面比例</h3>${svgBars(rows.map(r => ({ label: r.brand, v: r.neg_share == null ? null : r.neg_share * 100, c: bcolOf(s, r.brand) })), "%")}</div>
      <div class="card sec"><h3>議題熱度表</h3>${heat(s)}</div>
      <div class="card sec list"><h3>負面標題</h3>${iss || '<div class="muted">沒有資料</div>'}</div>
      ${rel ? `<div class="card sec"><h3>相關搜尋</h3>${rel}</div>` : ""}
      <div class="card sec list"><h3>Meta 廣告</h3>${ad || '<div class="muted">這次沒有廣告資料</div>'}</div>
      <div class="card sec"><h3>新聞</h3>${tbl([["title", "標題", "", r => link(r.url, r.title)], ["source", "來源"], ["date", "日期", "", r => esc(String(r.date || "").slice(5, 16))]], (s.news || []).slice(0, 60))}</div>
      <div class="card sec"><h3>PTT</h3>${tbl([["board", "看板"], ["title", "標題", "", r => link(r.url, r.title)], ["push", "推"]], (s.ptt || []).slice(0, 60))}</div>`;
  }
  if (tab === "price") {
    const menus = Object.entries(s.competitor_menus || {}).filter(([b, xs]) => xs.length && !(C.hide || []).includes(b)).map(([b, xs]) => `<details><summary>${esc(b)}（${xs.length} 項）</summary>${stbl("m_" + b, [["name", "品項"], ["price", "價格", "num", r => num(r.price) + (r.price_max && r.price_max !== r.price ? "–" + num(r.price_max) : "")]], xs)}</details>`).join("");
    return `<div class="card"><h3>價格帶比較</h3>${priceRange(s)}</div><div class="card sec list"><h3>菜單品項（點欄位排序）</h3>${menus || '<div class="muted">這次沒有抓到菜單價格</div>'}</div>`;
  }
  if (tab === "store") {
    const mp = Object.entries(s.maps || {}).filter(([, m]) => m && !m.error).map(([b, m]) => `<details><summary>${esc(b)}：${num(m.places)} 家、平均 ${num(m.avg_rating, 2)}、評論 ${num(m.reviews_total)}</summary>${stbl("mp_" + b, [["name", "門市"], ["rating", "評分", "num"], ["reviews", "評論數", "num", r => num(r.reviews)], ["address", "地址"]], m.rows || [])}</details>`).join("");
    const ch = s.changes || {};
    const chg = ch.incomplete ? `<div class="muted">${esc(ch.incomplete)}</div>` : ch.first ? '<div class="muted">這是第一次調查這個品牌，下次再調查就會列出新開／消失的門市。</div>' : ch.error ? "" :
      `<details><summary>新出現 ${num((ch.opened || []).length)} 家</summary>${tbl([["name", "門市"], ["address", "地址"]], ch.opened || [])}</details><details><summary>消失 ${num((ch.closed || []).length)} 家</summary>${tbl([["name", "門市"], ["address", "地址"]], ch.closed || [])}</details>`;
    const hasPts = Object.values(s.maps || {}).some(m => (m?.rows || []).some(r => r.lat != null));
    return `<div class="card"><h3>縣市分布</h3>${countyStack(s)}</div>
      ${hasPts ? `<div class="card sec"><h3>Google 地圖門市位置與評分</h3><div id="cmap" style="height:380px;border-radius:12px"></div><p class="muted">圓點顏色是品牌，點一下看評分。</p></div>` : ""}
      <div class="card sec list"><h3>地圖評分明細</h3>${mp || '<div class="muted">這次沒有地圖資料</div>'}</div>
      <div class="card sec"><h3>和上次調查比</h3>${chg}</div>
      <div class="card sec"><h3>${esc(s.brand)} 官網門市（${num((o.stores || []).length)} 家）</h3>${stbl("st", [["name", "門市"], ["address", "地址"], ["phone", "電話"]], o.stores || [])}</div>
      <div class="card sec list"><h3>競品官網門市</h3>${Object.entries(s.competitor_stores || {}).map(([b, xs]) => `<details><summary>${esc(b)}（${xs.length} 家）</summary>${tbl([["name", "門市"], ["address", "地址"]], xs)}</details>`).join("") || '<div class="muted">沒有資料</div>'}</div>`;
  }
  if (tab === "src") {
    const dists = [...new Set([...Object.keys(s.population || {}), ...Object.keys(s.income || {})])].map(k => ({ k, ...(s.population || {})[k], ...(s.income || {})[k] }));
    const search = Object.entries(s.search || {}).map(([tag, xs]) => `<details><summary>${esc(tag)}（${xs.length}）</summary>${xs.map(x => `<div class="it"><b>${link(x.url, x.title)}</b> <span class="muted">${esc((x.date || "").slice(0, 10))}</span><div class="muted">${esc(x.snippet)}</div></div>`).join("")}</details>`).join("");
    const learned = (o.learned || []).map(l => `<li>${esc(l.learned)}${l.key ? "：參數 " + esc(l.key) : ""}${l.new_records != null ? "，多抓到 " + l.new_records + " 筆" : ""}</li>`).join("");
    const fc = Object.entries(b.firecrawl_by_module || {}).filter(x => x[1]).map(([k, v]) => `${esc(k)} ${v}`).join("・");
    return `<div class="card"><h3>這次的費用</h3><div class="kv"><span>付費合計</span><b>NT$${num(b.spent_twd, 2)}／上限 ${num(b.limit_twd, 1)}</b><span>Firecrawl 點數</span><b>${num(b.calls?.fc_credit)}</b><span>Perplexity 搜尋／整理</span><b>${num(b.calls?.pplx_search_fast)}／${num(b.calls?.pplx_agent_fast)}</b></div><p class="muted">${fc}</p></div>
      <div class="card sec"><h3>信心等級怎麼看</h3><div class="list"><div class="it">${gradeChip("A")} 政府公開資料、官網原文、平台原始數字</div><div class="it">${gradeChip("B")} 媒體報導、標題分類、Perplexity 附來源整理</div><div class="it">${gradeChip("C")} 間接整理頁、系統推算（例如綜合評分）</div><div class="it">${gradeChip("D")} 待查：來源互相矛盾</div></div></div>
      ${learned ? `<div class="card sec"><h3>爬蟲自己學到的翻頁方式</h3><ul>${learned}</ul></div>` : ""}
      <div class="card sec list"><h3>Perplexity 各面向搜尋（點開看）</h3>${search || '<div class="muted">沒有資料</div>'}</div>
      <div class="card sec"><h3>官方消息</h3>${tbl([["date", "日期"], ["title", "標題", "", r => link(r.url, r.title)]], o.news || [])}</div>
      <div class="card sec"><h3>商圈人口與所得</h3>${tbl([["k", "行政區"], ["people", "人口", "num", r => num(r.people)], ["share_20_49", "20–49 歲", "num", r => r.share_20_49 == null ? "—" : num(r.share_20_49 * 100, 1) + "%"], ["median_k", "所得中位數（千元）", "num", r => num(r.median_k)]], dists)}</div>`;
  }
  return "";
}

function caseDetail(id) {
  const s = C.sum[id], back = `<button class="btn s" data-cback>← 回調查列表</button>`;
  if (!s) return head("讀取中…", back);
  if (s.error) return head("讀取失敗", back) + `<div class="err">${esc(s.error)}</div>`;
  const b = s.budget || {}, link = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t || u)}</a>` : esc(t || "");
  const tbl = (cols, rows) => rows.length ? `<div class="tw"><table><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>${rows.map(r => `<tr>${cols.map(c => `<td class="${c[2] || ""}">${c[3] ? c[3](r) : esc(r[c[0]] ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>` : '<div class="muted">這次沒有抓到資料</div>';
  const tab = C.tab || "ov";
  const tabs = `<div class="ctabs no-print">${CTABS.map(([k, l]) => `<button data-ctab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const exp = `<div class="bar no-print"><button class="btn" data-cppt="${esc(id)}">下載簡報</button><button class="btn s" data-cxlsx="${esc(id)}">Excel</button><button class="btn s" data-ccsv="${esc(id)}">CSV</button><button class="btn s" data-cjson="${esc(id)}">JSON</button><button class="btn s" data-cprint>列印／存 PDF</button>${back}</div>`;
  const body = C.printing ? CTABS.map(([k, l]) => `<h2 class="pbreak">${l}</h2>` + caseTab(s, id, k, tbl, link)).join("") : caseTab(s, id, tab, tbl, link);
  return head(esc(s.brand) + " 調查結果", "") + exp +
    `<p class="muted" style="margin-top:-4px">${esc(s.category || "")}・競品 ${esc((s.competitors || []).join("、") || "未填")}・主場 ${esc(s.region || "—")}・付費 NT$${num(b.spent_twd, 2)}（上限 ${num(b.limit_twd, 1)}）</p>
    ${tabs}${["ov", "tl", "src", "bg"].includes(tab) && !C.printing ? "" : `<div class="no-print">${brandFilter(s)}</div>`}${body}`;
}

function caseRows(s) {
  return (s.compare || []).map(r => ({ 品牌: r.brand, 官網: r.url, 官網門市: r.stores, 主場門市: r.stores_home, 價格中位數: r.price?.median, 價格P25: r.price?.p25, 價格P75: r.price?.p75, 品項數: r.price?.items, 價格來源: r.price_source, 聲量: r.mentions, 負面比例: r.neg_share, 搜尋熱度: r.trend_avg, 搜尋熱度季變化: r.trend_change, 地圖評分: r.map_rating, 地圖評論數: r.map_reviews, IG平均讚: r.ig_avg_likes, IG月發文: r.ig_per_30d, IG粉絲: r.ig_followers, FB平均互動: r.fb_avg_reactions, FB月發文: r.fb_per_30d, Meta廣告: r.ads_own, 投放中: r.ads_active, 近8季新聞: r.news_8q, 公司: r.company?.name, 統編: r.company?.id, 資本額: r.company?.capital, 設立: r.company?.setup, 風險新聞: qv("risk", r), 上市櫃代號: r.listed?.code, 當月營收千元: r.listed?.revenue_k, 營收年增: r.listed?.yoy_pct }));
}
function dl(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportCsv(id) { const s = C.sum[id]; const rows = caseRows(s), ks = Object.keys(rows[0] || {}); const q = v => v == null ? "" : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  dl(`市調_${s.brand}_${id}_品牌比較.csv`, "﻿" + [ks.join(","), ...rows.map(r => ks.map(k => q(r[k])).join(","))].join("\n"), "text/csv"); }
function exportJson(id) { const s = C.sum[id]; dl(`市調_${s.brand}_${id}.json`, JSON.stringify(s, null, 1), "application/json"); }
function printCase() { C.printing = true; render(); setTimeout(() => { window.print(); C.printing = false; render(); }, 300); }
function loadScript(src) { return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const e = document.createElement("script"); e.src = src; e.onload = ok; e.onerror = () => no(new Error("載入失敗")); document.head.appendChild(e); }); }

async function exportPpt(id) {
  const s = C.sum[id]; if (!s || s.error) return;
  try { await loadScript("https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"); } catch (e) { alert("簡報元件載入失敗，請稍後再試"); return; }
  const P = new PptxGenJS(); P.layout = "LAYOUT_WIDE"; const ink = "1D2433", sub = "5B6476", acc = "0F766E", COL = ["0F766E", "C2410C", "4F46E5", "BE185D", "64748B"];
  const names = (s.compare || []).map(r => r.brand), date = new Date().toISOString().slice(0, 10);
  const title = (sl, t, st) => { sl.addText(t, { x: .5, y: .3, w: 12.3, h: .7, fontSize: 26, bold: true, color: ink, fontFace: "Microsoft JhengHei" }); if (st) sl.addText(st, { x: .5, y: .95, w: 12.3, h: .4, fontSize: 13, color: sub, fontFace: "Microsoft JhengHei" });
    sl.addText(`市調中樞｜${s.brand}｜${date}`, { x: .5, y: 7.05, w: 12.3, h: .3, fontSize: 10, color: sub, fontFace: "Microsoft JhengHei" }); };
  const f = { fontFace: "Microsoft JhengHei" };
  let sl = P.addSlide(); sl.background = { color: acc };
  sl.addText(`${s.brand} 品牌與競品調查`, { x: .7, y: 2.4, w: 12, h: 1, fontSize: 40, bold: true, color: "FFFFFF", ...f });
  sl.addText(`${s.category || ""}｜競品：${(s.competitors || []).join("、")}｜主場：${s.region || "—"}`, { x: .7, y: 3.5, w: 12, h: .5, fontSize: 18, color: "E6F4F2", ...f });
  sl.addText(`調查日期 ${date}｜資料皆附來源，信心等級 A–D`, { x: .7, y: 4.1, w: 12, h: .5, fontSize: 14, color: "E6F4F2", ...f });
  const ins = insights(s);
  sl = P.addSlide(); title(sl, "重點發現", "系統依數字自動整理，每一句都可在介面追到來源");
  sl.addText(ins.slice(0, 9).map(x => ({ text: `[${x.lv}] ${x.t}`, options: { bullet: true, breakLine: true } })), { x: .6, y: 1.5, w: 12.2, h: 5.4, fontSize: 15, color: ink, valign: "top", paraSpaceAfter: 6, ...f });
  if (ins.length > 9) { sl = P.addSlide(); title(sl, "重點發現（續）"); sl.addText(ins.slice(9).map(x => ({ text: `[${x.lv}] ${x.t}`, options: { bullet: true, breakLine: true } })), { x: .6, y: 1.5, w: 12.2, h: 5.4, fontSize: 15, color: ink, valign: "top", ...f }); }
  const hdr = ["品牌", "官網門市", "價格中位數", "聲量", "負面", "搜尋熱度", "地圖評分", "近8季新聞", "月營收年增"].map(t => ({ text: t, options: { bold: true, color: "FFFFFF", fill: { color: acc } } }));
  const body = (s.compare || []).map(r => [r.brand, num(r.stores), num(r.price?.median), num(r.mentions), r.neg_share == null ? "—" : num(r.neg_share * 100) + "%", num(r.trend_avg), num(r.map_rating, 2), num(r.news_8q), r.listed ? num(r.listed.yoy_pct, 1) + "%" : "—"]);
  sl = P.addSlide(); title(sl, "品牌 vs 競品總表", "門市與價格來自官網；聲量為新聞＋PTT；搜尋熱度為 Google 搜尋趨勢相對值");
  sl.addTable([hdr, ...body], { x: .5, y: 1.5, w: 12.3, fontSize: 13, border: { type: "solid", color: "E3E6EC", pt: 1 }, color: ink, ...f });
  const sc = scorecard(s);
  sl = P.addSlide(); title(sl, "綜合評分卡", "各面向在這批品牌內換算 0–100，綜合為平均；同次調查內相對比較");
  sl.addChart(P.ChartType.bar, SCORE_DIMS.map((d, i) => ({ name: d[0], labels: sc.map(x => x.brand), values: sc.map(x => x.dims[i][1] || 0) })), { x: .5, y: 1.5, w: 8.2, h: 5.3, barGrouping: "clustered", showLegend: true, legendPos: "b", chartColors: COL.concat(["94A3B8"]), catAxisLabelFontFace: "Microsoft JhengHei", legendFontFace: "Microsoft JhengHei" });
  sl.addTable([[{ text: "品牌", options: { bold: true } }, { text: "綜合（面向數）", options: { bold: true } }], ...sc.map(x => [x.brand, x.total == null ? "—" : `${x.total}（${x.n}）`])], { x: 9, y: 1.6, w: 3.8, fontSize: 14, ...f, border: { type: "solid", color: "E3E6EC", pt: 1 } });
  const mt = [["stores", "官網門市（家）"], ["mentions", "聲量（則）"], ["trend_avg", "搜尋熱度"], ["news_8q", "近 8 季新聞（則）"]].filter(([k]) => (s.compare || []).some(r => qv(k, r) != null));
  for (let i = 0; i < mt.length; i += 2) { sl = P.addSlide(); title(sl, "關鍵指標比較");
    mt.slice(i, i + 2).forEach(([k, lab], j) => sl.addChart(P.ChartType.bar, [{ name: lab, labels: names, values: (s.compare || []).map(r => qv(k, r) || 0) }], { x: .5 + j * 6.3, y: 1.4, w: 6, h: 5.4, barDir: "bar", showTitle: true, title: lab, titleFontFace: "Microsoft JhengHei", chartColors: [COL[j]], showValue: true, catAxisLabelFontFace: "Microsoft JhengHei" })); }
  const nh = s.news_history || {}, qs = [...new Set(Object.values(nh).flatMap(x => Object.keys(x || {})))].sort();
  if (qs.length) { sl = P.addSlide(); title(sl, "新聞量逐季變化", "Google 新聞逐季回溯（每季上限 100 則）");
    sl.addChart(P.ChartType.line, Object.entries(nh).map(([b, x]) => ({ name: b, labels: qs, values: qs.map(q => x[q]?.n || 0) })), { x: .5, y: 1.5, w: 12.3, h: 5.3, chartColors: COL, showLegend: true, legendPos: "b", legendFontFace: "Microsoft JhengHei", lineDataSymbol: "circle" }); }
  const tr = s.trends; if (tr?.series) { const ks = tr.keywords || []; const pts = (tr.series[ks[0]] || []); const step = Math.max(1, Math.floor(pts.length / 60));
    sl = P.addSlide(); title(sl, "搜尋熱度走勢（近 5 年）", "Google 搜尋趨勢，同一把尺的相對值 0–100");
    sl.addChart(P.ChartType.line, ks.map(k => ({ name: k, labels: (tr.series[k] || []).filter((_, i) => i % step === 0).map(p => p.t), values: (tr.series[k] || []).filter((_, i) => i % step === 0).map(p => p.v) })), { x: .5, y: 1.5, w: 12.3, h: 5.3, chartColors: COL, showLegend: true, legendPos: "b", lineDataSymbol: "none", legendFontFace: "Microsoft JhengHei" }); }
  const lh = s.listed_history || {}; for (const [b, xs] of Object.entries(lh)) { if (!xs?.length) continue; const a = xs.slice().reverse();
    sl = P.addSlide(); title(sl, `${b} 月營收（近 ${a.length} 個月）`, "公開資訊觀測站，單位百萬元");
    sl.addChart(P.ChartType.bar, [{ name: "營收", labels: a.map(x => x.ym), values: a.map(x => Math.round((x.revenue_k || 0) / 1000)) }], { x: .5, y: 1.5, w: 12.3, h: 5.3, chartColors: [acc], showValue: false, catAxisLabelRotate: 45 }); }
  for (const [b, v] of Object.entries(s.background || {})) { const co = v.company || {}, rn = v.risk_news || {};
    sl = P.addSlide(); title(sl, `${b} 背景調查`, co.name ? `${co.name}（${co.id}）｜經濟部商工登記` : "商工登記查無對應公司");
    const left = co.name ? [`資本額 ${num((co.capital || 0) / 10000)} 萬｜實收 ${num((co.paid_in || 0) / 10000)} 萬`, `設立 ${co.setup || "—"}｜負責人 ${co.owner || "—"}`, `董監事 ${(co.directors || []).length} 位：${(co.directors || []).slice(0, 6).map(d => d.title + " " + d.name).join("、")}`, `法人股東：${(co.juristic_shareholders || []).join("、") || "無"}`] : ["商工登記查無名稱含品牌字的公司"];
    left.push("風險新聞：" + Object.entries(rn).filter(([k]) => ["食安衛生", "勞動", "裁罰", "訴訟", "加盟糾紛"].includes(k)).map(([k, r]) => `${k} ${r.n || 0}`).join("、"));
    sl.addText(left.map(t => ({ text: t, options: { bullet: true, breakLine: true } })), { x: .5, y: 1.5, w: 5.6, h: 5.3, fontSize: 13, color: ink, valign: "top", ...f });
    sl.addText(String(v.perplexity?.text || v.perplexity?.error || "").replace(/#+\s*/g, "").replace(/\n{2,}/g, "\n").slice(0, 1100), { x: 6.4, y: 1.5, w: 6.4, h: 5.2, fontSize: 9, fit: "shrink", color: ink, valign: "top", ...f });
    sl.addText("右欄由 Perplexity 附來源整理（信心 B），來源網址見介面「背景調查」", { x: 6.4, y: 6.8, w: 6.4, h: .25, fontSize: 9, color: sub, ...f }); }
  sl = P.addSlide(); title(sl, "資料來源與方法");
  sl.addText(["官網門市、菜單：爬蟲自動翻頁（API 頁碼、縣市選項、下一頁按鈕）", "聲量與議題：Google 新聞、PTT 標題分類；新聞逐季回溯近 8 季", "搜尋熱度：Google 搜尋趨勢近 5 年", "地圖評分：Google 地圖主場縣市", "公司與董監事：經濟部商工登記開放資料", "營收：公開資訊觀測站月營收", "背景整理：Perplexity 附來源", `本案付費 NT$${num(s.budget?.spent_twd, 2)}（上限 ${num(s.budget?.limit_twd, 1)}）`].map(t => ({ text: t, options: { bullet: true, breakLine: true } })), { x: .6, y: 1.5, w: 12, h: 5, fontSize: 15, color: ink, ...f });
  await P.writeFile({ fileName: `市調簡報_${s.brand}_${date}.pptx` });
}

function drawCaseMap() {
  const el = $("#cmap"), s = C.sum[C.sel]; if (!el || !window.L || !s) return;
  if (window._cmap) { try { window._cmap.remove(); } catch (_) {} }
  const m = window._cmap = L.map(el, { scrollWheelZoom: false }).setView([23.7, 120.9], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(m);
  const css = getComputedStyle(document.documentElement), pts = [], names = [s.brand, ...(s.competitors || [])];
  for (const [b, mp] of Object.entries(s.maps || {})) { if ((C.hide || []).includes(b)) continue; const c = css.getPropertyValue(["--b1", "--b2", "--b3", "--b4", "--sub"][Math.max(0, names.indexOf(b)) % 5]).trim();
    for (const r of mp?.rows || []) { if (r.lat == null) continue; L.circleMarker([r.lat, r.lng], { radius: 6, color: c, fillColor: c, fillOpacity: .8, weight: 1 }).addTo(m).bindPopup(`<b>${esc(r.name)}</b><br>${esc(r.address || "")}<br>評分 ${num(r.rating, 1)}・${num(r.reviews)} 則`); pts.push([r.lat, r.lng]); } }
  if (pts.length) m.fitBounds(pts, { padding: [20, 20], maxZoom: 13 });
}

function exportCase(id) {
  const s = C.sum[id]; if (!s || s.error) return;
  const wb = XLSX.utils.book_new(), add = (n, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ 說明: "沒有資料" }]), n);
  add("品牌vs競品", (s.compare || []).map(r => ({ 品牌: r.brand, 官網: r.url, 官網門市: r.stores, 主場門市: r.stores_home, 價格中位數: r.price?.median, 價格P25: r.price?.p25, 價格P75: r.price?.p75, 品項數: r.price?.items, 價格來源: r.price_source, 聲量: r.mentions, 負面比例: r.neg_share, 主要議題: Object.entries(r.issues || {}).slice(0, 5).map(x => x.join(" ")).join("、"), 搜尋熱度: r.trend_avg, 搜尋熱度季變化: r.trend_change, 地圖評分: r.map_rating, 地圖評論數: r.map_reviews, IG平均讚: r.ig_avg_likes, IG月發文: r.ig_per_30d, FB平均互動: r.fb_avg_reactions, FB月發文: r.fb_per_30d, Meta廣告: r.ads_own, 投放中: r.ads_active, 上市櫃代號: r.listed?.code, 營收月份: r.listed?.month, 當月營收千元: r.listed?.revenue_k, 營收年增: r.listed?.yoy_pct, 累計年增: r.listed?.ytd_yoy_pct })));
  add("菜單價格", Object.entries(s.competitor_menus || {}).flatMap(([b, xs]) => xs.map(x => ({ 品牌: b, 品項: x.name, 價格: x.price, 最高價: x.price_max }))));
  add("競品門市", Object.entries(s.competitor_stores || {}).flatMap(([b, xs]) => xs.map(x => ({ 品牌: b, ...x }))));
  add("地圖評分", Object.entries(s.maps || {}).flatMap(([b, m]) => (m?.rows || []).map(x => ({ 品牌: b, ...x }))));
  add("時間軸", (s.timeline?.rows || []).map(r => ({ 日期: r.d, 品牌: r.b, 類別: r.k, 筆數: r.n, 數值: r.x, 負面: r.neg })));
  add("背景調查", Object.entries(s.background || {}).map(([b, v]) => ({ 品牌: b, 公司: v.company?.name, 統編: v.company?.id, 資本額: v.company?.capital, 設立: v.company?.setup, 負責人: v.company?.owner, 法人股東: (v.company?.juristic_shareholders || []).join("、"), ...Object.fromEntries(Object.entries(v.risk_news || {}).map(([k, r]) => [k + "新聞", r.n])), Perplexity整理: v.perplexity?.text, 來源: (v.perplexity?.citations || []).join(" ") })));
  add("董監事", Object.entries(s.background || {}).flatMap(([b, v]) => (v.company?.directors || []).map(x => ({ 品牌: b, ...x }))));
  add("歷次快照", Object.entries(s.snapshots || {}).flatMap(([b, xs]) => Array.isArray(xs) ? xs.map(x => ({ 品牌: b, ...x })) : []));
  add("上市櫃月營收", Object.entries(s.listed_history || {}).flatMap(([b, xs]) => (xs || []).map(x => ({ 品牌: b, ...x }))));
  add("官網門市", s.official?.stores || []); add("官方消息", s.official?.news || []);
  add("搜尋重點", Object.entries(s.search || {}).flatMap(([tag, xs]) => xs.map(x => ({ 面向: tag, ...x }))));
  add("新聞", s.news || []); add("PTT", s.ptt || []); add("公司登記", s.registry || []);
  add("商圈", [...new Set([...Object.keys(s.population || {}), ...Object.keys(s.income || {})])].map(k => ({ 行政區: k, ...(s.population || {})[k], ...(s.income || {})[k] })));
  XLSX.writeFile(wb, `市調_${s.brand}_${id}.xlsx`);
}

document.addEventListener("click", e => {
  const cx = e.target.closest("[data-ctab],[data-hb],[data-cs],[data-cppt],[data-ccsv],[data-cjson],[data-cprint]");
  if (cx) { e.preventDefault(); const d = cx.dataset;
    if (d.ctab) { C.tab = d.ctab; render(); window.scrollTo(0, 0); }
    else if (d.hb) { C.hide = C.hide || []; C.hide = C.hide.includes(d.hb) ? C.hide.filter(x => x !== d.hb) : [...C.hide, d.hb]; render(); }
    else if (d.cs) { const [t, k] = d.cs.split("|"); C.sort = C.sort || {}; const cur = C.sort[t]; C.sort[t] = { k, d: cur && cur.k === k ? -cur.d : -1 }; render(); }
    else if (d.cppt) { cx.disabled = true; cx.textContent = "產生中…"; exportPpt(d.cppt).finally(() => render()); }
    else if (d.ccsv) exportCsv(d.ccsv); else if (d.cjson) exportJson(d.cjson); else if ("cprint" in d) printCase();
    return; }
  const ct = e.target.closest("[data-case],[data-cback],[data-crefresh],[data-cxlsx]");
  if (ct) { e.preventDefault();
    if (ct.dataset.case) openCase(ct.dataset.case);
    else if (ct.hasAttribute("data-cback")) { C.sel = null; render(); }
    else if (ct.hasAttribute("data-crefresh")) { C.msg = ""; loadCases(); }
    else if (ct.dataset.cxlsx) exportCase(ct.dataset.cxlsx);
    return; }
  const t = e.target.closest("[data-go],[data-reload],[data-logout],[data-xlsx],[data-sort]"); if (!t) return;
  if (t.dataset.go) { e.preventDefault(); S.page = t.dataset.go; C.sel = null; try { localStorage.setItem("mi_page", S.page); } catch (_) {} render(); window.scrollTo(0, 0); if (S.page === "cases") loadCases(); }
  else if (t.hasAttribute("data-reload")) load();
  else if (t.hasAttribute("data-logout")) { e.preventDefault(); sb.auth.signOut(); }
  else if (t.dataset.xlsx) exportX(t.dataset.xlsx);
  else if (t.dataset.sort) { const k = t.dataset.sort; S.f.dir = S.f.sort === k ? -S.f.dir : 1; S.f.sort = k; render(); }
});
document.addEventListener("change", e => { for (const k of ["qx", "qy", "qm"]) if (e.target.matches(`[data-${k}]`)) { C[k] = e.target.value; render(); return; } if (e.target.matches("[data-tg]")) { C.tg = e.target.value; render(); return; } if (e.target.matches("[data-tk]")) { C.tk = e.target.value; render(); return; } const k = e.target.dataset?.f; if (k && k !== "q") { S.f[k] = e.target.value; render(); } });
let qt; document.addEventListener("input", e => { if (e.target.dataset?.f === "q") { S.f.q = e.target.value; clearTimeout(qt); qt = setTimeout(() => { const pos = e.target.selectionStart; render(); const i = $('[data-f="q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 250); } });
document.addEventListener("input", e => { const f = e.target.closest("#cf"); if (f && e.target.name) C.draft[e.target.name] = e.target.value; });
document.addEventListener("submit", async e => {
  if (e.target.id === "cf") {
    e.preventDefault(); const body = { action: "create", ...C.draft };
    C.busy = true; C.msg = ""; render();
    try { await caseCall(body); C.msg = "✓ 已送出「" + (C.draft.brand || "") + "」，約 15–30 分鐘完成，這頁會自動更新進度。"; C.draft = {}; }
    catch (err) { C.msg = /金鑰/.test(err.message) ? "系統還沒接上 GitHub 金鑰，暫時無法開跑。" : "送出失敗：" + err.message; }
    C.busy = false; await loadCases(false); return;
  }
  if (e.target.id !== "lf") return; e.preventDefault();
  const email = e.target.em.value.trim(), password = e.target.pw.value;
  S.email = email;
  S.busy = true; S.err = ""; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  S.busy = false;
  if (error) { S.err = /Invalid login/i.test(error.message) ? "電子郵件或密碼不正確，請再試一次。" : "登入失敗：" + error.message; render(); }
});

try { S.page = localStorage.getItem("mi_page") || "home"; } catch (_) {}
sb.auth.onAuthStateChange((ev, session) => {
  const u = session?.user || null, changed = (u?.id || null) !== (S.user?.id || null);
  S.user = u;
  if (!u) { S.data = null; render(); return; }
  if (changed || !S.data) load().then(() => { if (S.page === "cases") loadCases(); });
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
